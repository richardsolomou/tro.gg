name: Deploy module

# Publishes the SpacetimeDB module to production (spacetime.tro.gg) on merge to main, through
# spacetime.yml's guarded publish: compatible migrations apply in place, a migration that needs
# manual steps is refused, and one that would break clients still on the old bindings is refused
# unless this workflow is dispatched with `break-clients`. The client deploys separately through
# Cloudflare Workers Builds.

on:
  push:
    branches: [main]
    paths:
      - 'spacetimedb/**'
      - 'shared/**'
      - '.github/workflows/deploy-module.yml'
      - '.github/workflows/spacetime.yml'
  workflow_dispatch:
    inputs:
      break-clients:
        description: Accept a migration that breaks clients still running the previous bindings.
        type: boolean
        default: false

concurrency:
  group: deploy-module
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spacetime:
    uses: ./.github/workflows/spacetime.yml
    with:
      ref: ${{ github.sha }}
      break-clients: ${{ inputs.break-clients || false }}
    secrets: inherit
