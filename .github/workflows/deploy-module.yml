name: Deploy module

# Publishes the SpacetimeDB module to production (spacetime.tro.gg) on merge to main, through
# spacetime.yml's guarded publish: compatible migrations apply in place and a migration that needs
# manual steps is refused. A merge accepts migrations that break clients on the old bindings,
# because Cloudflare Workers Builds deploys the new client independently and open clients reload
# through version.json; a manual run accepts them only with `break-clients`.

on:
  push:
    branches: [main]
    paths:
      - 'spacetimedb/**'
      - 'shared/**'
      - '.github/workflows/deploy-module.yml'
      - '.github/workflows/spacetime.yml'
  workflow_dispatch:
    inputs:
      break-clients:
        description: Accept a migration that breaks clients still running the previous bindings.
        type: boolean
        default: false

concurrency:
  group: deploy-module
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spacetime:
    uses: ./.github/workflows/spacetime.yml
    with:
      ref: ${{ github.sha }}
      break-clients: ${{ github.event_name == 'push' || inputs.break-clients }}
    secrets: inherit
