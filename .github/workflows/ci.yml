name: CI

# Gates every PR (and main) on the checks a deploy depends on, so a change that
# can't deploy fails review instead of failing after merge. The bindings check
# mirrors deploy-module's: `spacetime generate` builds the module and emits the
# client bindings, so a broken module build or stale committed bindings both fail
# here. No secrets are used — generate is fully local, so this runs on fork PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: richardsolomou/ras-stack/actions/setup-just@v1
        with:
          version: '1.58.0'

      - name: Check
        run: just check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Preview render harness
        run: just e2e

      - uses: richardsolomou/ras-stack/actions/setup-spacetime@v1
        with:
          version: '2.6.0'
          sha256: 24f5c011a1c5b14e9458f230f67f4700f2c89ce1d26bfee35c1f4d3570dc1ac8

      - name: Verify committed bindings match the module schema
        run: |
          spacetime generate --lang typescript --out-dir src/net/module_bindings --module-path spacetimedb -y
          if ! git diff --exit-code src/net/module_bindings; then
            echo "::error::src/net/module_bindings is stale — run 'just generate' and commit the result."
            exit 1
          fi

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    with:
      validation-workflow: ci.yml
    secrets: inherit
