name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v1
    with:
      command: pnpm check

  # The dev art preview renders in headless Chromium, so a rig or art regression that blanks it fails here.
  e2e:
    uses: richardsolomou/ras-stack/.github/workflows/check-browser.yml@v1
    with:
      command: pnpm test:e2e

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    with:
      validation-workflow: ci.yml
    secrets: inherit
